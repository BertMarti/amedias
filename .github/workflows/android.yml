name: App de Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: solo el trabajo de publicación puede escribir (y solo en etiquetas de versión).
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Huella del certificado de firma de las versiones publicadas. Si cambiara, Android no dejaría actualizar.
  CERT_SHA256: 5a5b274259e6d30bed717d24c018e71073bc8d23902ddbad9d80ea4f4e65bbbe

jobs:
  build:
    name: Compilar el APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:android
      - name: La app lleva la CSP con Trusted Types y no registra service worker
        run: |
          grep -q "require-trusted-types-for 'script'" dist-android/index.html
          grep -q "trusted-types repartito-sw" dist-android/index.html
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compilar (depuración, para la prueba en emulador)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: La app no pide ningún permiso del sistema (ni Internet)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee permisos.txt
          ! grep -E "uses-permission: name='android\.permission\." permisos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  emulator:
    name: Probar en un emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-debug
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            adb shell am start -W -n io.github.bertmarti.repartito/.MainActivity
            node scripts/android-e2e.mjs e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: capturas-emulador
          path: e2e/
          retention-days: 14

  release:
    name: Firmar y publicar
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Los secretos de firma solo existen en este entorno, que solo admite etiquetas v*.
    environment: android-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: La etiqueta coincide con la versión de package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build:android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Compilar y firmar
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.REPARTITO_KEYSTORE_BASE64 }}
          REPARTITO_KEYSTORE_PASSWORD: ${{ secrets.REPARTITO_KEYSTORE_PASSWORD }}
          REPARTITO_KEY_ALIAS: ${{ secrets.REPARTITO_KEY_ALIAS }}
        run: |
          export REPARTITO_KEYSTORE="$RUNNER_TEMP/firma.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$REPARTITO_KEYSTORE"
          ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$REPARTITO_KEYSTORE"
      - name: Comprobar firma, que no sea depurable y preparar los archivos
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee firma.txt
          grep -qi "SHA-256 digest: $CERT_SHA256" firma.txt
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then echo "El APK publicado no puede ser depurable"; exit 1; fi
          mkdir -p salida
          cp "$APK" "salida/repartito-$GITHUB_REF_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "salida/repartito-$GITHUB_REF_NAME.aab"
          (cd salida && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: salida/repartito-*
      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "Ver CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" salida/* -R "$GITHUB_REPOSITORY" --clobber
