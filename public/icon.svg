<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Repartito</title>
  <!-- Fondo de papel a sangre (sirve también como maskable: el disco queda dentro de la zona segura del 80 %). -->
  <rect width="512" height="512" rx="112" fill="#FBF7F0"/>
  <g transform="rotate(-8 256 256)">
    <!-- Círculo partido en diagonal: dos mitades, tomate y menta, con una rendija. -->
    <path d="M374.8 137.2A168 168 0 0 0 137.2 374.8Z" fill="#FF5A3C" transform="translate(-7 -7)"/>
    <path d="M374.8 137.2A168 168 0 0 1 137.2 374.8Z" fill="#17B897" transform="translate(7 7)"/>
  </g>
</svg>
